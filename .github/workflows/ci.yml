name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install lightweight test dependencies
        run: pip install "langchain-core>=0.3,<2" "typing-extensions>=4.12"
      - name: Compile
        run: python -m compileall -q rag_v2 tests
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
