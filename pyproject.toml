[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-langchain-agentic-rag-v2"
version = "2.0.0"
description = "LangChain-based Qwen3 medical Agentic RAG with semantic chunking and hybrid retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0",
  "chromadb>=1.0,<2",
  "langchain-core>=0.3,<2",
  "langchain-huggingface>=0.1,<2",
  "sentence-transformers>=3.4,<4",
  "transformers>=4.51,<5",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = ["ruff>=0.9", "pytest>=8"]
ui = ["gradio>=5,<7"]
train = [
  "datasets>=3,<5",
  "modelscope>=1.20,<2",
  "pandas>=2,<3",
  "swanlab>=0.5,<1",
]

[project.scripts]
qwen3-agentic-rag = "rag_v2.cli:main"
qwen3-agentic-rag-web = "rag_v2.webapp:main"

[tool.setuptools.packages.find]
include = ["rag_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
